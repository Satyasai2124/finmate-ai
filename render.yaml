services:
  - type: web
    name: finmate-ai
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: finmate-ai-db
          property: connectionString

databases:
  - name: finmate-ai-db
    databaseName: finmate
    user: finmate
    region: singapore
    plan: basic-256mb
